name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy needs to write a Pages artefact and mint an OIDC token for it.
permissions:
  contents: read
  pages: write
  id-token: write

# One live site, so a queued run supersedes a waiting one — but never cancels a
# deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # `output: 'export'` — a directory of files, no server. Pages hosts the
      # artefact and nothing runs at request time.
      - run: npm run build

      # The SPA fallback is gone with the SPA. Every route is now its own HTML
      # file, so a deep link like /docs/theming/ is a real 200 rather than
      # index.html served with a 404 status, and the export writes its own
      # 404.html for everything else.
      #
      # No CNAME file: on an artefact deploy the custom domain comes from the
      # repository's own Pages setting, not from a file in the artefact —
      # verified against the API after a deploy that did include one.
      - name: The export is static
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/sitemap.xml
          test -f out/components/button/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
