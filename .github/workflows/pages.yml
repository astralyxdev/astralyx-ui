name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy needs to write a Pages artefact and mint an OIDC token for it.
permissions:
  contents: read
  pages: write
  id-token: write

# One live site, so a queued run supersedes a waiting one — but never cancels a
# deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npm run build

      - name: SPA fallback
        # Pages has no rewrite rules: a deep link like /docs/theming is a 404 as
        # far as the server is concerned. Serving index.html as the 404 body
        # boots the app, and the router reads the real pathname from there. The
        # response keeps its 404 status, which is expected and harmless.
        #
        # No CNAME file: on an artefact deploy the custom domain comes from the
        # repository's own Pages setting, not from a file in the artefact —
        # verified against the API after a deploy that did include one.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
