name: Publish

on:
  # A tag is enough to ship. `v*` publishes on its own, because a tag that
  # marks a version and then waits for a second manual step is a version that
  # sits unpublished until someone remembers.
  push:
    tags: ['v*']
  # Kept alongside it: releasing from a tag that was already pushed fires this
  # a second time, which the already-published guard below turns into a no-op
  # rather than a failed duplicate publish.
  release:
    types: [published]
  workflow_dispatch:

# One publish at a time, and never two for the same tag racing each other.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # The whole authentication story. npm mints a short-lived credential from
  # this OIDC token at publish time, so there is no npm token in this repo's
  # secrets to leak, rotate or forget about.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
          # Node 22 carries npm 10 and fails here asking for a token, which
          # reads like a missing secret rather than a version problem.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: npm supports OIDC
        # Cheap assertion with a clear message, because the failure it guards
        # against surfaces much later and much less legibly. Pure shell, so it
        # does not fetch a package just to compare two version strings.
        run: |
          need=11.5.1
          have=$(npm -v)
          if [ "$(printf '%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm $have is too old for trusted publishing (need >= $need)"
            exit 1
          fi
          echo "npm $have supports OIDC"

      - run: npm ci
      - run: npm run lint
      - run: npm run build:package
      - run: node scripts/check-registry.mjs

      - name: Version is not on npm yet
        id: check
        # Two triggers can point at one version — a tag push and then a release
        # cut from that same tag. npm refuses the second with an error that
        # reads like a broken pipeline rather than "this already shipped", so
        # the duplicate is detected here and skipped instead.
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "astralyx-ui@$version" version >/dev/null 2>&1; then
            echo "astralyx-ui@$version is already published — nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "astralyx-ui@$version is new"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN and no --provenance flag: OIDC is detected
      # automatically, and npm attaches provenance on its own when a public
      # repo publishes a public package this way.
      - if: steps.check.outputs.publish == 'true'
        run: npm publish --access public
